name: VERTEX Daily Standup

on:
  schedule:
    # Every day at 9:00 AM (UTC+1 = 8:00 UTC)
    - cron: '0 8 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  daily-standup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install python-dotenv
      
      - name: Run daily standup
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEARCHER_NAME: ${{ secrets.RESEARCHER_NAME }}
        run: |
          python -m src.utils.vertex_simple report standup
      
      - name: Update results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add results/vertex/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔬 Daily standup $(date +%Y-%m-%d)" && git push)
