<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Logo K -->
  <g transform="translate(80, 180)">
    <circle cx="70" cy="70" r="65" fill="#0d1117" stroke="url(#blueGrad)" stroke-width="3"/>
    <path d="M45 30 L45 110 M45 70 L95 30 M45 70 L95 110" 
          stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="105" cy="40" r="6" fill="#22c55e"/>
    <circle cx="105" cy="70" r="6" fill="#3b82f6"/>
    <circle cx="105" cy="100" r="6" fill="#22c55e"/>
  </g>
  
  <!-- Title -->
  <text x="250" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#e6edf3">Adaptive-K</text>
  <text x="250" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#8b949e">MoE Routing Optimization</text>
  
  <!-- Stats boxes -->
  <g transform="translate(250, 340)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="45" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#22c55e" text-anchor="middle">30-50%</text>
    <text x="100" y="75" font-family="system-ui, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Cost Reduction</text>
  </g>
  
  <g transform="translate(480, 340)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="45" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#3b82f6" text-anchor="middle">&lt;1%</text>
    <text x="100" y="75" font-family="system-ui, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Quality Loss</text>
  </g>
  
  <g transform="translate(710, 340)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="45" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#a855f7" text-anchor="middle">3</text>
    <text x="100" y="75" font-family="system-ui, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Models Tested</text>
  </g>
  
  <!-- Neural network visualization on right -->
  <g transform="translate(950, 150)">
    <!-- Input nodes -->
    <circle cx="0" cy="50" r="12" fill="#3b82f6" opacity="0.8"/>
    <circle cx="0" cy="120" r="12" fill="#3b82f6" opacity="0.8"/>
    <circle cx="0" cy="190" r="12" fill="#3b82f6" opacity="0.8"/>
    <circle cx="0" cy="260" r="12" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Hidden nodes (experts) -->
    <circle cx="100" cy="30" r="15" fill="#22c55e"/>
    <circle cx="100" cy="100" r="15" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <circle cx="100" cy="170" r="15" fill="#22c55e"/>
    <circle cx="100" cy="240" r="15" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <circle cx="100" cy="310" r="15" fill="#22c55e"/>
    
    <!-- Output node -->
    <circle cx="200" cy="170" r="18" fill="#a855f7"/>
    
    <!-- Connections (only active) -->
    <line x1="12" y1="50" x2="85" y2="30" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="12" y1="120" x2="85" y2="170" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="12" y1="190" x2="85" y2="170" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="12" y1="260" x2="85" y2="310" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    
    <line x1="115" y1="30" x2="182" y2="160" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="115" y1="170" x2="182" y2="170" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="115" y1="310" x2="182" y2="180" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#161b22"/>
  <text x="80" y="612" font-family="system-ui, sans-serif" font-size="18" fill="#8b949e">adaptive-k.vertexdata.it</text>
  <text x="1120" y="612" font-family="system-ui, sans-serif" font-size="18" fill="#8b949e" text-anchor="end">by Vertex Data</text>
</svg>
