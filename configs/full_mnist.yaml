# Full Routing Baseline - MNIST
# BASELINE: Same architecture as sparse variants but K=N (all experts active)

run:
  task: "mnist"
  model: "sbm"  # Use SBM with K=N for full compute baseline
  seed: 42

hardware:
  device: "cpu"

sbm:
  experts_num: 16
  experts_top_k: 16    # K = N (all experts)
  tau_start: 1.0
  tau_end: 1.0
  tau_schedule: "constant"
  lambda_entropy: 0.0

data:
  batch_size: 128
  num_workers: 0

train:
  epochs: 10
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001

profiling:
  enabled: true
  warmup_steps: 20
  timed_steps: 50
  cuda_events: false
