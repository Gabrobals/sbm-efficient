# Full Routing Baseline - XOR
# BASELINE: Same architecture as sparse variants but K=N (all experts active)
# This is the "full compute" reference for measuring sparsity benefits

run:
  task: "xor"
  model: "sbm"  # Use SBM with K=N for full compute baseline
  seed: 42

hardware:
  device: "cpu"

sbm:
  experts_num: 8       # N = number of experts
  experts_top_k: 8     # K = N (all experts, ignored for full routing)
  tau_start: 1.0
  tau_end: 1.0
  tau_schedule: "constant"
  lambda_entropy: 0.0

data:
  batch_size: 64
  num_workers: 0

train:
  epochs: 30
  optimizer: "adamw"
  lr: 0.01
  weight_decay: 0.0

profiling:
  enabled: true
  warmup_steps: 20
  timed_steps: 50
  cuda_events: false
