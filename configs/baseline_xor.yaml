run:
  task: "xor"
  model: "baseline"
  seed: 42
  out_dir: "results/runs"
  notes: "Baseline MLP on XOR generalization task"

hardware:
  device: "cpu"
  precision: "fp32"

data:
  batch_size: 64
  num_workers: 2
  shuffle: true

train:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adamw"

sbm:
  experts_num: 8
  experts_top_k: 8  # all modules active
  decoherence_tau:
    start: 1.0
    end: 1.0
    schedule: "linear"
  entropy_lambda:
    value: 0.0
  routing:
    mode: "softmax"

profiling:
  enabled: true
  measure_flops: true
  measure_latency: true
  warmup_steps: 10
  timed_steps: 30
  cuda_events: true

logging:
  log_every_steps: 20
  save_checkpoints: false
  save_model: false
