run:
  task: "xor"
  model: "sbm_adaptive_k"
  seed: 42

hardware:
  device: "cpu"
  precision: "fp32"

sbm:
  experts_num: 8
  experts_top_k: 4  # Max K used to size router; actual K is dynamic per sample
  tau_start: 2.0
  tau_end: 0.5
  tau_schedule: "linear"
  lambda_entropy: 0.01

adaptive_k:
  k_values: [1, 2, 4]
  h_thresholds: [0.5, 1.0]

data:
  batch_size: 64
  num_workers: 0

train:
  epochs: 30
  optimizer: "adamw"
  lr: 0.01
  weight_decay: 0.0

profiling:
  enabled: true
  warmup_steps: 20
  timed_steps: 50
  cuda_events: false

logging:
  log_every_steps: 20
  save_checkpoints: false
  save_model: false
