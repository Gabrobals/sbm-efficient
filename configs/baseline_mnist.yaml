run:
  task: "mnist"
  model: "baseline"
  seed: 42
  out_dir: "results/runs"
  notes: "Baseline MLP - full compute on all modules"

hardware:
  device: "cpu"
  precision: "fp32"

data:
  batch_size: 128
  num_workers: 4
  shuffle: true

train:
  epochs: 20
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adamw"

sbm:
  experts_num: 16
  experts_top_k: 16  # all modules active (baseline)
  decoherence_tau:
    start: 1.0
    end: 1.0
    schedule: "linear"
  entropy_lambda:
    value: 0.0  # no entropy penalty for baseline
  routing:
    mode: "softmax"

profiling:
  enabled: true
  measure_flops: true
  measure_latency: true
  warmup_steps: 20
  timed_steps: 50
  cuda_events: true

logging:
  log_every_steps: 50
  save_checkpoints: false
  save_model: false
