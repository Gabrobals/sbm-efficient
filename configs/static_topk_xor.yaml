# Static Top-K Baseline - XOR
# Routing variant: always selects same K experts (fixed at init)

run:
  task: "xor"
  model: "static_topk"
  seed: 42

hardware:
  device: "cpu"

sbm:
  experts_num: 8
  experts_top_k: 2     # K = 2 (sparse)
  tau_start: 1.0
  tau_end: 1.0
  tau_schedule: "constant"
  lambda_entropy: 0.0

data:
  batch_size: 64
  num_workers: 0

train:
  epochs: 30
  optimizer: "adamw"
  lr: 0.01
  weight_decay: 0.0

profiling:
  enabled: true
  warmup_steps: 20
  timed_steps: 50
  cuda_events: false
